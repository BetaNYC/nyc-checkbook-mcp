# CI gate for @betanyc/nyc-checkbook-mcp.
#
# What it enforces: the TypeScript build (`npm run build` -> `tsc`) succeeds on
# a clean `npm ci` install, across the supported Node range. This catches type
# errors and dependency drift before merge — the same version-safety discipline
# the main workspace's Python tree enforces in engineering-checks.yml (see
# platform/system/engineering-standards.md in BetaNYC_AI_Workspace).
#
# Runs `npm test`, which is `npm run build && node --test test/*.test.mjs` —
# the same command a developer runs locally. That matters: this job previously
# ran a bare `node --test`, which discovers test files by walking the directory
# and therefore stayed green even while the `npm test` script itself was broken
# on Node 20 (a quoted glob, unsupported as a `node --test` argument before Node
# 22, matched nothing and ran zero tests). CI and local must run the same
# command or CI cannot vouch for the command anyone actually uses.
#
# The glob in that script is deliberately UNQUOTED so the shell expands it and
# node receives literal file paths on every supported version. Do not re-add the
# quotes.
#
# No separate build step: `npm test` compiles first, so one would only run tsc
# twice. A compile error still fails the job, with tsc's output at the top of
# the step log.
#
# Node matrix: 20.x and 22.x. package.json declares engines "node >= 18", but
# Node 18 reached End-of-Life on 2025-04-30, so the matrix covers only
# actively-maintained LTS releases (20 = floor, 22 = current LTS). This mirrors
# the established convention in the sibling nyc-charter-laws-rules repo
# (.github/workflows/test.yml). If the engines floor is raised to >= 20, update
# this comment. fail-fast is disabled so a break on one version still reports
# the other.

name: CI

on:
  # `test/**` matters: the tests and their fixtures are .mjs/.xml, so `**/*.ts`
  # does not match them and a test-only change would otherwise skip this gate
  # entirely — silently, which is the failure mode this workflow exists to catch.
  pull_request:
    branches: [main]
    paths:
      - "**/*.ts"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
      - "WHATS-CHANGED.md"
      - "CHANGELOG.md"
      - "DATA-SOURCES.json"
      - "data.json"
      - "scripts/**"
  push:
    branches: [main]
    paths:
      - "**/*.ts"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
      - "WHATS-CHANGED.md"
      - "CHANGELOG.md"
      - "DATA-SOURCES.json"
      - "data.json"
      - "scripts/**"
  # Manual trigger — lets us fire a run on any branch. Needed because a
  # path-scoped pull_request/push event does not fire on the very PR that
  # introduces the workflow, so this gate never executed on its own PR (#2).
  # Adding `.github/workflows/**` to the path filters above closes that gap for
  # future workflow edits; this dispatch is retained permanently as a low-cost
  # affordance for on-demand re-runs.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build & test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "20.x"
          - "22.x"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

  # The about-data standard (betanyc-ai-workspace platform/system/about-data-standard.md § 7).
  # scripts/whats_changed.py, scripts/tests/catalog_validate.py, scripts/mcp_shared/ and
  # src/betanyc-tools.ts are copies of the workspace's canonical files: never edit them here.
  # 1. DATA-SOURCES.json is valid and every tool the built server lists has a source.
  # 2. data.json (DCAT-US 3.0) matches DATA-SOURCES.json; rebuild with the same command
  #    without --check. 3. DATA-SOURCES.json against its JSON Schema and data.json against the
  #    vendored DCAT-US 3.0 schema, with pinned validators (CI only, not runtime dependencies).
  # The release gate (`about-data check --release`, which also refuses the placeholder contact)
  # runs in release.yml before `npm publish`. It is not run here.
  about-data:
    name: About data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Build
        run: npm ci && npm run build

      - name: The server's tool list
        run: node scripts/list-tools.mjs > "$RUNNER_TEMP/tools.json"

      - name: DATA-SOURCES.json is valid and explains every tool
        run: python3 scripts/whats_changed.py about-data check DATA-SOURCES.json --tools-file "$RUNNER_TEMP/tools.json"

      - name: data.json is current
        run: python3 scripts/whats_changed.py about-data catalog DATA-SOURCES.json --check

      - name: Validate against the JSON Schema and DCAT-US 3.0
        run: |
          uv run --no-project --with jsonschema==4.26.0 --with referencing==0.37.0 --with rfc3987==1.3.8 \
            python scripts/tests/catalog_validate.py data-sources DATA-SOURCES.json
          uv run --no-project --with jsonschema==4.26.0 --with referencing==0.37.0 --with rfc3987==1.3.8 \
            python scripts/tests/catalog_validate.py dcat data.json

  # The What's changed standard (betanyc-ai-workspace
  # platform/system/whats-changed-standard.md § 10). scripts/whats_changed.py is a copy of the
  # workspace's canonical file: never edit it here. `check --base-ref` needs the base branch's
  # history (fetch-depth: 0): old entries are append-only, and a package.json version bump
  # needs an MCP entry naming the new version. This repo has no site, so there is no page to
  # rebuild: GitHub's rendering of WHATS-CHANGED.md is the page. Stdlib only, so no pip install.
  whats-changed:
    name: What's changed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check WHATS-CHANGED.md
        run: python3 scripts/whats_changed.py check WHATS-CHANGED.md --base-ref "origin/${{ github.base_ref || 'main' }}"
